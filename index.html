<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>중국어 단어 플래시카드 (전체 507단어)</title>
  <style>
    :root {
      --bg-color: #f1f5f9;
      --card-bg: #ffffff;
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border-color: #e2e8f0;
      --star-active: #f59e0b;
      --star-inactive: #cbd5e1;
      --check-active: #10b981;
      --check-inactive: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans SC", "Noto Sans KR", sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .container {
      width: 100%;
      max-width: 550px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .select-box {
      width: 100%;
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
      outline: none;
      cursor: pointer;
    }

    .filter-tabs {
      display: flex;
      gap: 6px;
      width: 100%;
    }

    .filter-btn {
      flex: 1;
      padding: 9px 6px;
      border-radius: 8px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-sub);
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .sub-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .toggle-wrap {
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
    }

    .card-scene {
      width: 100%;
      height: 310px;
      perspective: 1000px;
      cursor: pointer;
      position: relative;
    }

    .card {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.4s ease;
      border-radius: 16px;
      box-shadow: 0 8px 20px -4px rgba(0, 0, 0, 0.08);
    }

    .card.is-flipped {
      transform: rotateY(180deg);
    }

    .card-face {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
      user-select: none;
    }

    .top-action-btn {
      position: absolute;
      top: 12px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      z-index: 20;
      transition: transform 0.15s ease;
    }

    .top-action-btn:hover {
      transform: scale(1.2);
    }

    .check-btn {
      left: 14px;
      color: var(--check-inactive);
      font-size: 1.5rem;
      font-weight: bold;
    }

    .check-btn.active {
      color: var(--check-active);
    }

    .star-btn {
      right: 14px;
      color: var(--star-inactive);
      font-size: 1.6rem;
    }

    .star-btn.active {
      color: var(--star-active);
    }

    .card-front .word {
      font-size: 2.6rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 10px;
    }

    .card-front .hint {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .card-back {
      transform: rotateY(180deg);
      background-color: #fafafa;
    }

    .card-back .pinyin {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 12px;
    }

    .card-back .meaning {
      font-size: 1.05rem;
      line-height: 1.55;
      color: var(--text-main);
      word-break: keep-all;
    }

    .controls {
      display: flex;
      gap: 10px;
      width: 100%;
      justify-content: center;
    }

    button.btn {
      padding: 10px 18px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-main);
      border-radius: 8px;
      cursor: pointer;
    }

    button.btn:hover {
      background-color: #f8fafc;
    }

    button.btn.primary {
      background-color: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    button.btn.primary:hover {
      background-color: var(--primary-hover);
    }

    .bottom-actions {
      display: flex;
      gap: 6px;
    }

    .guide {
      font-size: 0.75rem;
      color: var(--text-sub);
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 챕터 선택 -->
    <select id="chapter-select" class="select-box">
      <option value="all">전체 단어 통합 (총 507단어)</option>
      <option value="part1">1. 영양과 미량 영양소 (67단어)</option>
      <option value="part2">2. 전통 예절과 좌식 문화 변천 (85단어)</option>
      <option value="part3">3. 해바라기 굴광·굴열 작용 (51단어)</option>
      <option value="part4">4. [1번 지문] 발광의 원리 (68단어)</option>
      <option value="part5">5. [2번 지문] 문어의 생태와 방어 (87단어)</option>
      <option value="part6">6. [3번 지문] 파괴적 혁신과 조직 (76단어)</option>
      <option value="part7">7. [4번 지문] 언어와 뇌, 동물의 문자 인식 (73단어)</option>
    </select>

    <!-- 보기 모드 탭 -->
    <div class="filter-tabs">
      <button class="filter-btn active" id="tab-all">전체 보기</button>
      <button class="filter-btn" id="tab-scrap">스크랩 (<span id="scrap-count">0</span>)</button>
      <button class="filter-btn" id="tab-learned">외운 단어 (<span id="learned-count">0</span>)</button>
    </div>

    <!-- 진행 상황 및 세부 옵션 -->
    <div class="sub-bar">
      <span id="counter" style="font-weight: 700;">0 / 0</span>
      <label class="toggle-wrap">
        <input type="checkbox" id="hide-learned-toggle"> 외운 단어 숨기기
      </label>
      <div class="bottom-actions">
        <button class="btn" id="shuffle-btn" style="padding: 4px 8px; font-size: 0.75rem;">섞기</button>
        <button class="btn" id="reset-btn" style="padding: 4px 8px; font-size: 0.75rem; color: #ef4444;">초기화</button>
      </div>
    </div>

    <!-- 플래시카드 영역 -->
    <div class="card-scene" id="card-scene">
      <button class="top-action-btn check-btn" id="check-btn" title="외움 완료 (단축키: V)">✓</button>
      <button class="top-action-btn star-btn" id="star-btn" title="스크랩 (단축키: S)">★</button>

      <div class="card" id="card">
        <div class="card-face card-front">
          <div class="word" id="front-word">단어 로딩 중...</div>
          <div class="hint">클릭 또는 스페이스바로 뒤집기</div>
        </div>
        <div class="card-face card-back">
          <div class="pinyin" id="back-pinyin">병음</div>
          <div class="meaning" id="back-meaning">의미</div>
        </div>
      </div>
    </div>

    <!-- 컨트롤 버튼 -->
    <div class="controls">
      <button class="btn" id="prev-btn">이전 (←)</button>
      <button class="btn primary" id="flip-btn">뒤집기 (Space)</button>
      <button class="btn" id="next-btn">다음 (→)</button>
    </div>

    <div class="guide">
      [← / →] 단어 이동 &nbsp;|&nbsp; [Space] 뒤집기 &nbsp;|&nbsp; [V] 외움 완료 체크 &nbsp;|&nbsp; [S] 스크랩
    </div>
  </div>

    // 안전한 저장소 래퍼 (로컬 파일 에러 완전 차단)
    const storage = {
      get(key, fallback) {
        try {
          const val = localStorage.getItem(key);
          return val ? JSON.parse(val) : fallback;
        } catch(e) { return fallback; }
      },
      set(key, val) {
        try { localStorage.setItem(key, JSON.stringify(val)); } catch(e) {}
      }
    };

    let savedList = storage.get('voca_scrap_v3', []);
    let learnedList = storage.get('voca_learned_v3', []);
    let chapterProgress = storage.get('voca_progress_v3', {});
    let hideLearned = storage.get('voca_hide_v3', false);
    let selectedPart = storage.get('voca_part_v3', 'all');

    let currentMode = 'all'; // 'all', 'scrap', 'learned'
    let words = [];
    let currentIndex = 0;
    let isFlipped = false;

    // DOM 노드
    const card = document.getElementById('card');
    const cardScene = document.getElementById('card-scene');
    const frontWord = document.getElementById('front-word');
    const backPinyin = document.getElementById('back-pinyin');
    const backMeaning = document.getElementById('back-meaning');
    const counter = document.getElementById('counter');
    const starBtn = document.getElementById('star-btn');
    const checkBtn = document.getElementById('check-btn');
    const scrapCountElem = document.getElementById('scrap-count');
    const learnedCountElem = document.getElementById('learned-count');
    const tabAll = document.getElementById('tab-all');
    const tabScrap = document.getElementById('tab-scrap');
    const tabLearned = document.getElementById('tab-learned');
    const chapterSelect = document.getElementById('chapter-select');
    const hideLearnedToggle = document.getElementById('hide-learned-toggle');

    // UI 컨트롤 상태 초기화
    chapterSelect.value = selectedPart;
    hideLearnedToggle.checked = hideLearned;

    function saveState() {
      storage.set('voca_scrap_v3', savedList);
      storage.set('voca_learned_v3', learnedList);
      storage.set('voca_progress_v3', chapterProgress);
      storage.set('voca_part_v3', selectedPart);
      storage.set('voca_hide_v3', hideLearned);

      scrapCountElem.textContent = savedList.length;
      learnedCountElem.textContent = learnedList.length;
    }

    function buildWordList() {
      let list = [...rawData];

      if (selectedPart !== 'all') {
        list = list.filter(item => item.part === selectedPart);
      }

      if (currentMode === 'scrap') {
        list = list.filter(item => savedList.includes(item.word));
      } else if (currentMode === 'learned') {
        list = list.filter(item => learnedList.includes(item.word));
      }

      if (hideLearned && currentMode !== 'learned') {
        list = list.filter(item => !learnedList.includes(item.word));
      }

      words = list;

      const progressKey = `${selectedPart}_${currentMode}_${hideLearned}`;
      const savedIndex = chapterProgress[progressKey] || 0;
      currentIndex = (savedIndex < words.length) ? savedIndex : 0;
    }

    function updateActionButtons() {
      if (words.length === 0) {
        starBtn.style.display = 'none';
        checkBtn.style.display = 'none';
        return;
      }
      starBtn.style.display = 'block';
      checkBtn.style.display = 'block';

      const currentWordStr = words[currentIndex].word;
      starBtn.classList.toggle('active', savedList.includes(currentWordStr));
      checkBtn.classList.toggle('active', learnedList.includes(currentWordStr));
    }

    function updateCard() {
      isFlipped = false;
      card.classList.remove('is-flipped');

      if (words.length === 0) {
        frontWord.innerHTML = `<span style="font-size: 1.1rem; color: #94a3b8;">해당 조건의 단어가 없습니다.</span>`;
        backPinyin.textContent = "";
        backMeaning.textContent = "";
        counter.textContent = "0 / 0";
        updateActionButtons();
        return;
      }

      const item = words[currentIndex];
      frontWord.textContent = item.word;
      backPinyin.textContent = item.pinyin;
      backMeaning.textContent = item.meaning;
      counter.textContent = `${currentIndex + 1} / ${words.length}`;

      updateActionButtons();

      const progressKey = `${selectedPart}_${currentMode}_${hideLearned}`;
      chapterProgress[progressKey] = currentIndex;
      saveState();
    }

    function toggleFlip() {
      if (words.length === 0) return;
      isFlipped = !isFlipped;
      card.classList.toggle('is-flipped', isFlipped);
    }

    function prevWord() {
      if (currentIndex > 0) {
        currentIndex--;
        updateCard();
      }
    }

    function nextWord() {
      if (currentIndex < words.length - 1) {
        currentIndex++;
        updateCard();
      }
    }

    function shuffleWords() {
      if (words.length === 0) return;
      for (let i = words.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [words[i], words[j]] = [words[j], words[i]];
      }
      currentIndex = 0;
      updateCard();
    }

    function toggleScrap() {
      if (words.length === 0) return;
      const wordStr = words[currentIndex].word;
      if (savedList.includes(wordStr)) {
        savedList = savedList.filter(w => w !== wordStr);
      } else {
        savedList.push(wordStr);
      }
      saveState();
      updateActionButtons();

      if (currentMode === 'scrap') {
        buildWordList();
        updateCard();
      }
    }

    function toggleLearned() {
      if (words.length === 0) return;
      const wordStr = words[currentIndex].word;
      if (learnedList.includes(wordStr)) {
        learnedList = learnedList.filter(w => w !== wordStr);
      } else {
        learnedList.push(wordStr);
      }
      saveState();
      updateActionButtons();

      if (hideLearned || currentMode === 'learned') {
        buildWordList();
        updateCard();
      }
    }

    function setTab(mode) {
      currentMode = mode;
      tabAll.classList.toggle('active', mode === 'all');
      tabScrap.classList.toggle('active', mode === 'scrap');
      tabLearned.classList.toggle('active', mode === 'learned');
      buildWordList();
      updateCard();
    }

    // 진도 초기화
    document.getElementById('reset-btn').addEventListener('click', () => {
      if (confirm('학습 진도, 외운 단어, 스크랩을 모두 초기화하시겠습니까?')) {
        savedList = [];
        learnedList = [];
        chapterProgress = {};
        hideLearned = false;
        hideLearnedToggle.checked = false;
        selectedPart = 'all';
        chapterSelect.value = 'all';
        currentMode = 'all';
        tabAll.classList.add('active');
        tabScrap.classList.remove('active');
        tabLearned.classList.remove('active');
        saveState();
        buildWordList();
        updateCard();
      }
    });

    // 카드 영역 클릭 이벤트
    cardScene.addEventListener('click', (e) => {
      if (e.target.closest('.top-action-btn')) return;
      toggleFlip();
    });

    starBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleScrap();
    });

    checkBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleLearned();
    });

    document.getElementById('flip-btn').addEventListener('click', toggleFlip);
    document.getElementById('prev-btn').addEventListener('click', prevWord);
    document.getElementById('next-btn').addEventListener('click', nextWord);
    document.getElementById('shuffle-btn').addEventListener('click', shuffleWords);

    chapterSelect.addEventListener('change', (e) => {
      selectedPart = e.target.value;
      buildWordList();
      updateCard();
    });

    hideLearnedToggle.addEventListener('change', (e) => {
      hideLearned = e.target.checked;
      buildWordList();
      updateCard();
    });

    tabAll.addEventListener('click', () => setTab('all'));
    tabScrap.addEventListener('click', () => setTab('scrap'));
    tabLearned.addEventListener('click', () => setTab('learned'));

    // 단축키 조작
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        e.preventDefault();
        toggleFlip();
      } else if (e.code === 'ArrowLeft') {
        prevWord();
      } else if (e.code === 'ArrowRight') {
        nextWord();
      } else if (e.code === 'KeyS') {
        toggleScrap();
      } else if (e.code === 'KeyV') {
        toggleLearned();
      }
    });

    // 실행 시작
    saveState();
    buildWordList();
    updateCard();
  </script>
</body>
</html>
